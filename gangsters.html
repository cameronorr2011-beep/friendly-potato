<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gangster Shootout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #17151d; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7em; }
  a { color: #8ab4ff; text-decoration: none; }
  h1 { font-size: 1.5rem; }
  canvas { background: #2a2a30; border: 2px solid #444; border-radius: 8px; max-width: 100%; }
  #keys { display: flex; gap: 2em; font-size: .85rem; }
  #keys b.r1 { color: #8ab4ff; } #keys b.r2 { color: #ff8a80; }
  footer { font-size: .8rem; opacity: .6; }
</style>
</head>
<body>
  <h1>🔫 Gangster Shootout</h1>
  <div id="keys">
    <span><b class="r1">Blue:</b> WASD move · <b>Space</b> shoot</span>
    <span><b class="r2">Red:</b> Arrows move · <b>Enter</b> shoot</span>
  </div>
  <canvas id="game" width="640" height="420"></canvas>
  <footer>First to 5 rounds wins · tap the canvas to rematch</footer>
  <a href="index.html">← back</a>
<script>
const c = document.getElementById('game'), x = c.getContext('2d');
const W = 640, H = 420, R = 12;
const WALLS = [
  {x: 0, y: 0, w: W, h: 14}, {x: 0, y: H-14, w: W, h: 14},
  {x: 0, y: 0, w: 14, h: H}, {x: W-14, y: 0, w: 14, h: H},
  {x: 120, y: 100, w: 22, h: 90}, {x: 320, y: 0, w: 22, h: 80},
  {x: 320, y: 340, w: 22, h: 80}, {x: 500, y: 230, w: 22, h: 90},
  {x: 190, y: 230, w: 90, h: 22}, {x: 420, y: 190, w: 22, h: 110}
];

let P1, P2, bullets, keys = {}, pWins, aWins, winner;

function spawn() {
  P1 = {x: 80, y: H/2, hp: 100, dx: 1, dy: 0, cd: 0, color: '#8ab4ff'};
  P2 = {x: W-80, y: H/2, hp: 100, dx: -1, dy: 0, cd: 0, color: '#ff8a80'};
  bullets = []; winner = null;
}
function newGame(){ pWins = 0; aWins = 0; spawn(); }
newGame();

function hitWall(px, py, r) {
  return WALLS.some(w => px + r > w.x && px - r < w.x + w.w && py + r > w.y && py - r < w.y + w.h);
}
function move(p, mx, my) {
  if (!hitWall(p.x + mx, p.y, R)) p.x += mx;
  if (!hitWall(p.x, p.y + my, R)) p.y += my;
  p.x = Math.max(R, Math.min(W - R, p.x));
  p.y = Math.max(R, Math.min(H - R, p.y));
}

function loop() {
  if (!winner) {
    const sp = 2.8;
    let m1x = (keys.d1 ? sp : 0) - (keys.a1 ? sp : 0), m1y = (keys.s1 ? sp : 0) - (keys.w1 ? sp : 0);
    let m2x = (keys.d2 ? sp : 0) - (keys.a2 ? sp : 0), m2y = (keys.s2 ? sp : 0) - (keys.w2 ? sp : 0);
    if (m1x || m1y) { const l = Math.hypot(m1x, m1y); move(P1, m1x/l*sp, m1y/l*sp); P1.dx = m1x||0; P1.dy = m1y||0; }
    if (m2x || m2y) { const l = Math.hypot(m2x, m2y); move(P2, m2x/l*sp, m2y/l*sp); P2.dx = m2x||0; P2.dy = m2y||0; }

    if (keys.f1 && P1.cd <= 0) { bullets.push({x: P1.x, y: P1.y, vx: P1.dx*7, vy: P1.dy*7, o: P1}); P1.cd = 24; }
    if (keys.f2 && P2.cd <= 0) { bullets.push({x: P2.x, y: P2.y, vx: P2.dx*7, vy: P2.dy*7, o: P2}); P2.cd = 24; }
    P1.cd--; P2.cd--;

    for (const b of bullets) {
      b.x += b.vx; b.y += b.vy;
      let dead = hitWall(b.x, b.y, 3);
      const foe = b.o === P1 ? P2 : P1;
      if (!dead && Math.hypot(b.x - foe.x, b.y - foe.y) < R + 3) { foe.hp -= 15; dead = true; }
      if (foe.hp <= 0 && !dead) {
        if (b.o === P1) pWins++; else aWins++;
        winner = pWins >= 5 ? 'BLUE wins the war! 🎉' : aWins >= 5 ? 'RED wins the war! 🎉' : null;
        if (winner) break;
        setTimeout(spawn, 900);
        winner = 'killed';
        break;
      }
      if (dead) b.gone = true;
    }
    bullets = bullets.filter(b => !b.gone && b.x > 0 && b.x < W && b.y > 0 && b.y < H);
  }
  draw();
  requestAnimationFrame(loop);
}

function draw() {
  x.fillStyle = '#2a2a30'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#3d3b45';
  WALLS.forEach(w => x.fillRect(w.x, w.y, w.w, w.h));
  x.fillStyle = '#57555f'; WALLS.forEach(w => x.fillRect(w.x, w.y + w.h - 4, w.w, 4));

  [P1, P2].forEach(p => {
    x.fillStyle = p.color;
    x.beginPath(); x.arc(p.x, p.y, R, 0, 7); x.fill();
    x.strokeStyle = '#1c1b22'; x.lineWidth = 2;
    x.beginPath(); x.arc(p.x, p.y, R, 0, 7); x.stroke();
    x.fillStyle = '#1c1b22'; // hat
    x.beginPath(); x.ellipse(p.x, p.y - R + 3, R - 4, 3.5, 0, 0, 7); x.fill();
    const fx = p.dx ? p.dx : 0, fy = p.dy ? p.dy : (p.fx || 1);
    x.fillStyle = '#141318';
    if (p.dx) x.fillRect(p.x + Math.sign(p.dx) * R, p.y - 2, 12 * Math.sign(p.dx), 4);
    else x.fillRect(p.x - 2, p.y + Math.sign(p.dy) * R, 4, 12 * Math.sign(p.dy));
    // health bar
    x.fillStyle = '#111'; x.fillRect(p.x - 20, p.y + R + 6, 40, 5);
    x.fillStyle = p.color; x.fillRect(p.x - 20, p.y + R + 6, 40 * Math.max(0, p.hp) / 100, 5);
  });

  bullets.forEach(b => { x.beginPath(); x.arc(b.x, b.y, 3, 0, 7); x.fillStyle = '#ffd166'; x.fill(); });

  x.font = 'bold 20px sans-serif'; x.textAlign = 'center';
  x.fillStyle = '#8ab4ff'; x.fillText('BLUE  ' + pWins, W/2 - 120, 34);
  x.fillStyle = '#ff8a80'; x.fillText(aWins + '  RED', W/2 + 120, 34);
  x.fillStyle = '#888'; x.font = '12px sans-serif';
  x.fillText('rounds', W/2, 34);

  if (winner && winner !== 'killed') {
    x.fillStyle = 'rgba(0,0,0,.65)'; x.fillRect(0, H/2 - 55, W, 110);
    x.fillStyle = '#fff'; x.font = 'bold 30px sans-serif';
    x.fillText(winner, W/2, H/2 - 5);
    x.font = '15px sans-serif'; x.fillText('tap to rematch', W/2, H/2 + 25);
  }
}

const MAP1 = {KeyW: 'w1', KeyS: 's1', KeyA: 'a1', KeyD: 'd1'};
const MAP2 = {ArrowUp: 'w2', ArrowDown: 's2', ArrowLeft: 'a2', ArrowRight: 'd2'};
document.addEventListener('keydown', e => {
  if (MAP1[e.code]) { keys[MAP1[e.code]] = 1; e.preventDefault(); }
  if (MAP2[e.code]) { keys[MAP2[e.code]] = 1; e.preventDefault(); }
  if (e.code === 'Space') { keys.f1 = 1; e.preventDefault(); }
  if (e.code === 'Enter') { keys.f2 = 1; e.preventDefault(); }
  if (winner && winner !== 'killed' && (e.code === 'Space' || e.code === 'Enter')) { pWins = 0; aWins = 0; spawn(); }
});
document.addEventListener('keyup', e => {
  if (MAP1[e.code]) keys[MAP1[e.code]] = 0;
  if (MAP2[e.code]) keys[MAP2[e.code]] = 0;
  if (e.code === 'Space') keys.f1 = 0;
  if (e.code === 'Enter') keys.f2 = 0;
});
c.addEventListener('pointerdown', () => { if (winner && winner !== 'killed') { pWins = 0; aWins = 0; spawn(); } });
loop();
</script>
</body>
</html>
