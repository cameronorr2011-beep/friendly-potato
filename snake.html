<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1c1b22; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8em; }
  a { color: #8ab4ff; text-decoration: none; }
  h1 { font-size: 1.5rem; }
  canvas { background: #26252e; border: 2px solid #444; border-radius: 8px; }
  #hud { font-size: 1.05rem; letter-spacing: .05em; }
  footer { font-size: .8rem; opacity: .6; }
</style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div id="hud">Score: <b id="score">0</b></div>
  <canvas id="game" width="400" height="400"></canvas>
  <footer>Arrow keys or WASD · tap the canvas to restart</footer>
  <a href="archive.html">← back</a>
<script>
const c = document.getElementById('game'), x = c.getContext('2d');
const G = 20, CELLS = 20;
let snake, dir, next, food, score, dead, timer;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0}; next = null; score = 0; dead = false;
  placeFood();
  document.getElementById('score').textContent = 0;
  clearInterval(timer);
  timer = setInterval(step, 110);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  if (dead) return;
  if (next) { dir = next; next = null; }
  const head = {x: (snake[0].x + dir.x + CELLS) % CELLS, y: (snake[0].y + dir.y + CELLS) % CELLS};
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    dead = true; draw(); return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++; document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  x.fillStyle = '#26252e'; x.fillRect(0, 0, 400, 400);
  x.fillStyle = '#ff7043';
  x.beginPath(); x.arc(food.x*G + G/2, food.y*G + G/2, G/2 - 3, 0, 7); x.fill();
  snake.forEach((s, i) => {
    x.fillStyle = i === 0 ? '#a5d6a7' : '#66bb6a';
    x.fillRect(s.x*G + 1, s.y*G + 1, G - 2, G - 2);
  });
  if (dead) {
    x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, 150, 400, 100);
    x.fillStyle = '#fff'; x.font = 'bold 28px sans-serif'; x.textAlign = 'center';
    x.fillText('Game Over', 200, 195);
    x.font = '16px sans-serif'; x.fillText('tap to play again', 200, 220);
  }
}

document.addEventListener('keydown', e => {
  const map = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]};
  const m = map[e.key] || map[e.key.toLowerCase()];
  if (!m) return;
  e.preventDefault();
  const nd = {x: m[0], y: m[1]};
  if (nd.x !== -dir.x || nd.y !== -dir.y) next = nd;
});

c.addEventListener('pointerdown', () => { if (dead) reset(); });
reset();
</script>
</body>
</html>
