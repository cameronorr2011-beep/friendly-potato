<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle Echo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14131a; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7em; padding: 12px; }
  h1 { font-size: 1.25rem; }
  h1 .ic { accent }
  .hud { font-size: .95rem; opacity: .85; }
  footer { font-size: .78rem; opacity: .55; text-align: center; }
  a { color: #b8a6f2; text-decoration: none; }
  button { background: #b8a6f2; border: 0; color: #17161c; font-weight: 600; padding: .5em 1.2em; border-radius: 8px; cursor: pointer; font-size: .9rem; }
  canvas { border: 2px solid #3a3a44; border-radius: 6px; max-width: 100%; touch-action: none; }
  
  #pads { display: grid; grid-template-columns: 110px 110px; gap: 10px; }
  .p { width: 110px; height: 110px; background: #171e26; border: 2px solid #3a3a44; border-radius: 14px; cursor: pointer; opacity: .8; }
  .p.on { opacity: 1; }

</style>
</head>
<body>
<h1><span class="ic">🎵</span> Gentle Echo</h1>
<div class="hud">Round <b id="round">0</b> · <span id="msg"></span></div><div id="pads"><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div></div><button id="go">⏵ Start</button>
<footer id="ctrl"></footer>
<a href="../archive.html">← back</a>
<script>

const COLORS = ['#ff5252', '#ffd166', '#66d97f', '#5b8ff9'];
const pads = [...document.querySelectorAll('.p')];
let seq = [], idx = 0, playing = false;
function flash(pad, ms) {
  return new Promise(res => {
    pad.classList.add('on'); pad.style.background = COLORS[pads.indexOf(pad)];
    setTimeout(() => { pad.classList.remove('on'); pad.style.background = ''; setTimeout(res, 120); }, ms);
  });
}
async function play() {
  playing = true; idx = 0;
  document.getElementById('round').textContent = seq.length;
  for (const s of seq) await flash(pads[s], 560);
  playing = false;
}
pads.forEach((p, n) => p.addEventListener('pointerdown', () => {
  if (playing || seq.length === 0) return;
  p.style.background = COLORS[n];
  setTimeout(() => p.style.background = '', 150);
  if (n === seq[idx]) {
    idx++;
    if (idx === seq.length) {
      document.getElementById('msg').textContent = 'Correct!';
      setTimeout(async () => {
        seq.push(Math.random() * 4 | 0); await play();
      }, 550);
    }
  } else {
    document.getElementById('msg').textContent = 'Wrong! You reached round ' + seq.length + '. Tap ⏵.';
    seq = [];
  }
}));
document.getElementById('go').addEventListener('click', async () => {
  if (playing) return;
  seq = [Math.random() * 4 | 0];
  document.getElementById('msg').textContent = 'Watch, then repeat…';
  await play();
});
document.getElementById('ctrl').textContent = 'Memorize the flashing pattern and repeat it';

</script>
</body>
</html>
