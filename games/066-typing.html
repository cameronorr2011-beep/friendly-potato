<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type-a-Weather</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14131a; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7em; padding: 12px; }
  h1 { font-size: 1.25rem; }
  h1 .ic { accent }
  .hud { font-size: .95rem; opacity: .85; }
  footer { font-size: .78rem; opacity: .55; text-align: center; }
  a { color: #a5d6a7; text-decoration: none; }
  button { background: #a5d6a7; border: 0; color: #17161c; font-weight: 600; padding: .5em 1.2em; border-radius: 8px; cursor: pointer; font-size: .9rem; }
  canvas { border: 2px solid #3a3a44; border-radius: 6px; max-width: 100%; touch-action: none; }
  
  #w { font-size: 2rem; font-weight: 700; color: #a5d6a7; letter-spacing: .06em; }
  #in { font-size: 1.4rem; padding: .5em 1em; border-radius: 8px; border: 2px solid #a5d6a7; background: #191919; color: #fff; width: 320px; max-width: 92vw; text-align: center; }

</style>
</head>
<body>
<h1><span class="ic">🌦️</span> Type-a-Weather</h1>
<div class="hud">Words <b id="score">0</b> · <b id="time">60s</b></div><div id="w">…</div><input id="in" autocomplete="off" spellcheck="false" autofocus>
<footer id="ctrl"></footer>
<a href="../archive.html">← back</a>
<script>

const WORDS = ['drizzle', 'monsoon', 'blizzard', 'sunshowers', 'thunder', 'cyclone', 'frosty', 'overcast', 'rainbow'];
let total = 0, left = 60, cur = '';
const inp = document.getElementById('in'), out = document.getElementById('w');
function next() { cur = WORDS[Math.random() * WORDS.length | 0]; out.textContent = cur; inp.value = ''; }
next();
const ct = setInterval(() => {
  left--; document.getElementById('time').textContent = left + 's';
  if (left <= 0) {
    clearInterval(ct); inp.disabled = true;
    const wpm = Math.round(total / 60 * 60);
    document.getElementById('ctrl').innerHTML = 'Time! Typed <b>' + total + '</b> words (~' + wpm + ' WPM) · <button onclick="location.reload()">Play again</button>';
  }
}, 1000);
inp.addEventListener('input', () => {
  if (inp.value.trim().toLowerCase() === cur.toLowerCase()) {
    total++; hud(); next();
  }
});
function hud() { document.getElementById('score').textContent = total; }
hud();
document.getElementById('ctrl').textContent = 'Type each word correctly and it counts · 60 seconds';

</script>
</body>
</html>
