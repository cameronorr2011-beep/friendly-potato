<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflex Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14131a; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7em; padding: 12px; }
  h1 { font-size: 1.25rem; }
  h1 .ic { accent }
  .hud { font-size: .95rem; opacity: .85; }
  footer { font-size: .78rem; opacity: .55; text-align: center; }
  a { color: #ff9dbb; text-decoration: none; }
  button { background: #ff9dbb; border: 0; color: #17161c; font-weight: 600; padding: .5em 1.2em; border-radius: 8px; cursor: pointer; font-size: .9rem; }
  canvas { border: 2px solid #3a3a44; border-radius: 6px; max-width: 100%; touch-action: none; }
  
  #box { width: 520px; max-width: 94vw; height: 260px; background: #22222a; border: 2px solid #3a3a44; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 600; text-align: center; cursor: pointer; user-select: none; padding: 1em; }

</style>
</head>
<body>
<h1><span class="ic">🧠</span> Reflex Test</h1>
<div class="hud"><b id="score">Best — · Avg —</b></div><div id="box"></div>
<footer id="ctrl"></footer>
<a href="../archive.html">← back</a>
<script>

const box = document.getElementById('box');
let armed = false, go = 0, times = [];
box.textContent = 'Tap / press Space to start';
function arm() {
  box.style.background = '#5a2020'; box.textContent = 'Wait for GREEN…';
  armed = 'pending';
  setTimeout(() => {
    if (armed !== 'pending') return;
    go = performance.now(); armed = true;
    box.style.background = '#2f7d33'; box.textContent = 'CLICK NOW!';
  }, 800 + Math.random() * 1800);
}
function result() {
  const ms = Math.round(performance.now() - go);
  times.push(ms);
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  document.getElementById('score').textContent = 'Best ' + Math.min(...times) + 'ms · Avg ' + avg + 'ms';
  box.style.background = '#22222a'; box.textContent = ms + 'ms — tap for round ' + (times.length + 1);
  armed = false;
}
box.addEventListener('pointerdown', () => {
  if (!armed) arm();
  else if (armed === 'pending') { armed = false; box.style.background = '#22222a'; box.textContent = 'Too soon! Tap to retry'; }
  else result();
});
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return; e.preventDefault();
  if (!armed) arm();
  else if (armed === 'pending') { armed = false; box.style.background = '#22222a'; box.textContent = 'Too soon! Tap to retry'; }
  else result();
});
document.getElementById('ctrl').textContent = 'Wait for green — fastest 5 taps wins bragging rights';

</script>
</body>
</html>
