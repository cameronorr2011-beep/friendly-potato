<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14131a; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7em; padding: 12px; }
  h1 { font-size: 1.25rem; }
  h1 .ic { accent }
  .hud { font-size: .95rem; opacity: .85; }
  footer { font-size: .78rem; opacity: .55; text-align: center; }
  a { color: #e6b45a; text-decoration: none; }
  button { background: #e6b45a; border: 0; color: #17161c; font-weight: 600; padding: .5em 1.2em; border-radius: 8px; cursor: pointer; font-size: .9rem; }
  canvas { border: 2px solid #3a3a44; border-radius: 6px; max-width: 100%; touch-action: none; }
  
</style>
</head>
<body>
<h1><span class="ic">🐢</span> Slow Pong</h1>
<canvas id="g" width="560" width="560" height="340"></canvas>
<footer id="ctrl"></footer>
<a href="../archive.html">← back</a>
<script>

const c = document.getElementById('g'), x = c.getContext('2d');
const W = c.width, H = c.height, PH = 70, WIN = 5, AI = 2.8, SPD = 3.2;
let py, ay, ball, ps, as, winner, my = H/2;
reset();
function reset() { ps = 0; as = 0; winner = null; serve(1); }
function serve(L) {
  py = H/2 - PH/2; ay = H/2 - PH/2;
  ball = {x: W/2, y: H/2, vx: (L?1:-1) * SPD, vy: (Math.random()>.5?1:-1)*(SPD-1.5)};
}
function loop() {
  if (!winner) {
    ay += Math.max(-AI, Math.min(AI, ball.y - PH/2 - ay));
    py = Math.max(0, Math.min(H - PH, my - PH/2));
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.y < 7 || ball.y > H - 7) ball.vy *= -1;
    if (ball.vx < 0 && ball.x < 24 && ball.x > 14 && ball.y > py && ball.y < py + PH) { ball.vx *= -1.06; ball.vy += (ball.y - (py+PH/2)) * .05; }
    if (ball.vx > 0 && ball.x > W - 24 && ball.x < W - 14 && ball.y > ay && ball.y < ay + PH) { ball.vx *= -1.06; ball.vy += (ball.y - (ay+PH/2)) * .05; }
    if (ball.x < 0) { as++; serve(as > ps); }
    if (ball.x > W) { ps++; serve(ps > as); }
    if (ps >= WIN || as >= WIN) winner = ps >= WIN;
  }
  draw(); requestAnimationFrame(loop);
}
function draw() {
  x.fillStyle = '#221f17'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#2c3242'; x.setLineDash([8,10]);
  x.beginPath(); x.moveTo(W/2, 0); x.lineTo(W/2, H); x.stroke(); x.setLineDash([]);
  x.fillStyle = '#e8e8e8'; x.font = 'bold 30px sans-serif'; x.textAlign = 'center';
  x.fillText(ps, W/2 - 55, 42); x.fillText(as, W/2 + 55, 42);
  x.fillStyle = '#e6b45a'; x.fillRect(14, py, 10, PH);
  x.fillStyle = '#ff8a80'; x.fillRect(W-24, ay, 10, PH);
  x.beginPath(); x.arc(ball.x, ball.y, 6, 0, 7); x.fillStyle = '#fff'; x.fill();
  document.getElementById('ctrl').textContent = 'First to ' + WIN + ' wins · move with mouse or arrows';
  x.fillStyle = '#fff'; x.font = '12px sans-serif';
  if (winner) {
    x.fillStyle = 'rgba(0,0,0,.65)'; x.fillRect(0, H/2-55, W, 110);
    x.fillStyle = '#fff'; x.font = 'bold 28px sans-serif';
    x.fillText(winner ? 'You win! Tap to rematch' : 'Computer wins. Tap to rematch', W/2, H/2);
  }
}
c.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(); my = (e.clientY - r.top) * (H/r.height); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowUp') my -= 26; if (e.key === 'ArrowDown') my += 26; e.preventDefault(); });
c.addEventListener('pointerdown', () => winner && reset());
loop();

</script>
</body>
</html>
