<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen Taps</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14131a; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7em; padding: 12px; }
  h1 { font-size: 1.25rem; }
  h1 .ic { accent }
  .hud { font-size: .95rem; opacity: .85; }
  footer { font-size: .78rem; opacity: .55; text-align: center; }
  a { color: #ff9dbb; text-decoration: none; }
  button { background: #ff9dbb; border: 0; color: #17161c; font-weight: 600; padding: .5em 1.2em; border-radius: 8px; cursor: pointer; font-size: .9rem; }
  canvas { border: 2px solid #3a3a44; border-radius: 6px; max-width: 100%; touch-action: none; }
  
</style>
</head>
<body>
<h1><span class="ic">🧘</span> Zen Taps</h1>
<div class="hud">Hits <b id="score">0</b> · <b id="time">20s</b></div><canvas id="g" width="480" height="380"></canvas>
<footer id="ctrl"></footer>
<a href="../archive.html">← back</a>
<script>

const c = document.getElementById('g'), x = c.getContext('2d');
const SECS = 20, RUSH = 120;
let targets = [], score = 0, left = SECS, t = 0;
const ct = setInterval(() => {
  left--; document.getElementById('time').textContent = left + 's';
  if (left <= 0) end();
}, 1000);
function end() {
  clearInterval(ct);
  document.getElementById('ctrl').innerHTML = 'Time! Final: <b>' + score + '</b> hits · <button onclick="location.reload()">Play again</button>';
}
const life = 1400;
function spawn() {
  targets.push({x: Math.random() * c.width, y: Math.random() * c.height, r: 22 - (SECS - left) * 54.0, born: t});
}
function loop() {
  t++;
  if (t % 30 === 0) spawn();
  x.fillStyle = '#241a24'; x.fillRect(0, 0, c.width, c.height);
  targets = targets.filter(z => t - z.born < 84);
  targets.forEach(z => {
    x.globalAlpha = 1 - (t - z.born) / 84 * .55;
    x.fillStyle = '#ff9dbb';
    x.beginPath(); x.arc(z.x, z.y, Math.max(6, z.r), 0, 7); x.fill();
  });
  x.globalAlpha = 1;
  requestAnimationFrame(loop);
}
c.addEventListener('pointerdown', e => {
  const r = c.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (c.width / r.width), my = (e.clientY - r.top) * (c.height / r.height);
  let hitit = false;
  targets = targets.filter(z => {
    if (!hitit && Math.hypot(z.x - mx, z.y - my) < Math.max(6, z.r) + 6) { hitit = true; score++; hud(); return false; }
    return true;
  });
});
setInterval(spawn, 72000); // steady rhythm too
function hud() { document.getElementById('score').textContent = score; }
hud(); loop();

</script>
</body>
</html>
