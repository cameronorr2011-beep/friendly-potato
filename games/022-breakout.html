<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short Brick</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14131a; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7em; padding: 12px; }
  h1 { font-size: 1.25rem; }
  h1 .ic { accent }
  .hud { font-size: .95rem; opacity: .85; }
  footer { font-size: .78rem; opacity: .55; text-align: center; }
  a { color: #ffd166; text-decoration: none; }
  button { background: #ffd166; border: 0; color: #17161c; font-weight: 600; padding: .5em 1.2em; border-radius: 8px; cursor: pointer; font-size: .9rem; }
  canvas { border: 2px solid #3a3a44; border-radius: 6px; max-width: 100%; touch-action: none; }
  
</style>
</head>
<body>
<h1><span class="ic">🧱</span> Short Brick</h1>
<canvas id="g" width="480" height="360"></canvas>
<footer id="ctrl"></footer>
<a href="../archive.html">← back</a>
<script>

const c = document.getElementById('g'), x = c.getContext('2d');
const W = c.width, H = c.height, ROWS = 3, COLS = 8, SPD = 3.4;
c.width = W; // noop
let pad, ball, bricks, lives, score, level, over;
const BW = (W - 40) / COLS, BH = 18;
function make(level) {
  bricks = [];
  for (let r = 0; r < ROWS + Math.min(level, 3); r++)
    for (let cc = 0; cc < COLS; cc++)
      bricks.push({x: 20 + cc * BW, y: 50 + r * (BH + 6), w: BW - 6, h: BH, alive: 1});
}
function reset() {
  pad = {x: W/2 - 40, w: 80, h: 10};
  ball = {x: W/2, y: H - 60, vx: 3.2, vy: -4, r: 6};
  lives = 3; score = 0; level = 0; over = false; make(0); hud();
}
function hud() { document.getElementById('score').textContent = 'Score ' + score + ' · Lives ' + lives + ' · Level ' + (level + 1); }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') pad.x -= 34;
  if (e.key === 'ArrowRight') pad.x += 34;
  pad.x = Math.max(0, Math.min(W - pad.w, pad.x));
  e.preventDefault();
});
c.addEventListener('pointermove', e => {
  const r = c.getBoundingClientRect();
  pad.x = Math.max(0, Math.min(W - pad.w, (e.clientX - r.left) * (W / r.width) - pad.w/2));
});
c.addEventListener('pointerdown', () => {
  if (over) reset(); else ball.stuck = false;
});
reset(); ball.stuck = true;
function loop() {
  if (!over && !ball.stuck) {
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
    if (ball.y < ball.r) ball.vy *= -1;
    if (ball.y > H - 34 && ball.x > pad.x && ball.x < pad.x + pad.w) {
      ball.vy = -Math.abs(ball.vy);
      ball.vx += (ball.x - (pad.x + pad.w/2)) * .06;
      const s = Math.hypot(ball.vx, ball.vy) / Math.hypot(3.2, SPD);
      if (s > 1.6) { ball.vx *= 1.55 / s; ball.vy *= 1.55 / s; }
    }
    if (ball.y > H) {
      lives--; hud();
      if (lives <= 0) over = true;
      ball = {x: W/2, y: H - 60, vx: 3.2, vy: -SPD, r: 6, stuck: true};
    }
    for (const b of bricks) if (b.alive && ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
      b.alive = 0; score += 10; hud();
      ball.vy *= -1; ball.vx += (ball.x - (b.x + b.w/2)) * .02;
      break;
    }
    if (bricks.every(b => !b.alive)) {
      level++; make(level); hud();
      ball = {x: W/2, y: H - 60, vx: 3.2, vy: -(SPD + level * .8), r: 6, stuck: true};
    }
  }
  draw(); requestAnimationFrame(loop);
}
function draw() {
  x.fillStyle = '#1a1f16'; x.fillRect(0, 0, W, H);
  bricks.forEach(b => { if (!b.alive) return;
    x.fillStyle = ['#ffd166', '#ff8a80', '#ffd166', '#a5d6a7'][Math.floor(b.y / 26) % 4];
    x.fillRect(b.x, b.y, b.w, b.h); });
  x.fillStyle = '#ffd166'; x.fillRect(pad.x, H - 24, pad.w, pad.h);
  x.beginPath(); x.arc(ball.x, ball.y, ball.r, 0, 7); x.fillStyle = '#fff'; x.fill();
  if (over) {
    x.fillStyle = 'rgba(0,0,0,.65)'; x.fillRect(0, H/2 - 50, W, 100);
    x.fillStyle = '#fff'; x.font = 'bold 26px sans-serif'; x.textAlign = 'center';
    x.fillText('Game Over · ' + score + ' pts', W/2, H/2 - 5);
    x.font = '14px sans-serif'; x.fillText('tap to restart', W/2, H/2 + 25);
  } else if (ball.stuck) {
    x.fillStyle = '#fff'; x.font = '15px sans-serif'; x.textAlign = 'center';
    x.fillText('tap to launch', W/2, H - 44);
  }
}
loop();

</script>
</body>
</html>
