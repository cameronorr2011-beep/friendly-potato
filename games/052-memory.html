<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Ocean</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #14131a; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7em; padding: 12px; }
  h1 { font-size: 1.25rem; }
  h1 .ic { accent }
  .hud { font-size: .95rem; opacity: .85; }
  footer { font-size: .78rem; opacity: .55; text-align: center; }
  a { color: #7ee787; text-decoration: none; }
  button { background: #7ee787; border: 0; color: #17161c; font-weight: 600; padding: .5em 1.2em; border-radius: 8px; cursor: pointer; font-size: .9rem; }
  canvas { border: 2px solid #3a3a44; border-radius: 6px; max-width: 100%; touch-action: none; }
  
  #m { display: grid; grid-template-columns: repeat(6, 64px); gap: 6px; }
  .c { width: 64px; height: 64px; background: #151d24; border: 2px solid #3a3a44; border-radius: 8px; font-size: 1.7rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .1s; }
  .c.up { background: #7ee787; color: #14131a; }
  .c.ok { background: #4d5d43; cursor: default; }

</style>
</head>
<body>
<h1><span class="ic">🐠</span> Memory Ocean</h1>
<div class="hud">Moves: <b id="moves">0</b></div><div id="m"></div>
<footer id="ctrl"></footer>
<a href="../archive.html">← back</a>
<script>

const SYM = ['🐠', '🐳', '🐙', '🦈', '🦀', '🐡', '🐚', '🦑', '🐬', '🪼', '🦞', '🐋', '🦭', '🪸', '🪝', '🌊', '💧', '🚤'];
let n = 0, pairs = Math.floor(SYM.length * 2 / 2);
const deck = [...SYM, ...SYM].sort(() => Math.random() - .5);
const grid = document.getElementById('m');
let open = [], lock = false, found = 0;
deck.forEach(s => {
  const d = document.createElement('div'); d.className = 'c'; d.dataset.s = s; d.textContent = '?';
  d.addEventListener('click', () => {
    if (lock || d.classList.contains('ok') || open.includes(d)) return;
    d.textContent = s; d.classList.add('up'); open.push(d);
    if (open.length === 2) {
      lock = true; n++;
      document.getElementById('moves').textContent = n;
      const [a, b] = open;
      if (a.dataset.s === b.dataset.s) {
        a.classList.add('ok'); b.classList.add('ok'); found++;
        open = []; lock = false;
        if (found === SYM.length) {
          document.getElementById('ctrl').innerHTML = 'Solved in ' + n + ' moves! <button onclick="location.reload()">Play again</button>';
        }
      } else setTimeout(() => {
        a.textContent = '?'; b.textContent = '?';
        a.classList.remove('up'); b.classList.remove('up');
        open = []; lock = false;
      }, 750);
    }
  });
  grid.appendChild(d);
});

</script>
</body>
</html>
